[www]
user = www-data
group = www-data

; nginx talks to this socket over the compose network; a TCP listen keeps the
; healthcheck in docker-compose.yml simple too.
listen = 0.0.0.0:9000

; Sizing for a 2 GB host that also runs Redis, nginx, a queue worker and the
; scheduler: four workers at 192M is the whole php-fpm budget. Raise
; max_children together with the app service's mem_limit, never one alone.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

; Laravel reads everything from the environment (APP_KEY, DB_CONNECTION,
; REDIS_HOST...). The default pool wipes the env for workers, which is how a
; container ends up with a site that boots but cannot find its database.
clear_env = no

; Worker output belongs in the container log (docker compose logs app) rather
; than in php-fpm's own error log, and unwrapped so it reads cleanly.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[upload_tmp_dir] = /tmp

pm.status_path = /fpm-status
