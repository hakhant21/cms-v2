; One container, three processes: php-fpm, the queue worker and the Laravel
; scheduler (schedule:work stands in for a system cron daemon). supervisord is
; PID 1 and restarts any of them if they die. Every log goes to the container's
; stdout/stderr so `docker compose logs app` shows the whole picture.
;
; The queue and scheduler can be switched off per host without editing this
; file, by setting SUPERVISOR_QUEUE_AUTOSTART / SUPERVISOR_SCHEDULER_AUTOSTART
; to "false" in .env — useful on a machine that only serves pages.
[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Every %(ENV_...)s below has a default set in the Dockerfile, so the image
; also starts correctly when run without compose.

; php-fpm's master stays root so it can drop to www-data per pool.
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
priority=10
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Horizon supervises the queue workers itself (contact-form mail, translation
; runs, chat broadcasts), scaling processes per config/horizon.php. It needs
; Redis — QUEUE_CONNECTION=redis is set in the image. On TERM Horizon stops
; accepting jobs and waits for the running ones to finish, so stopwaitsecs is
; long enough for a translation job (timeout 600) to land before a deploy
; restarts the container.
[program:queue]
command=php artisan horizon
directory=/var/www/html
user=www-data
priority=20
autostart=%(ENV_SUPERVISOR_QUEUE_AUTOSTART)s
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=600
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work --no-interaction
directory=/var/www/html
user=www-data
priority=30
autostart=%(ENV_SUPERVISOR_SCHEDULER_AUTOSTART)s
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
