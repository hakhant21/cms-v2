; One container, three processes: php-fpm, the queue worker and the Laravel
; scheduler (schedule:work stands in for a system cron daemon). supervisord is
; PID 1 and restarts any of them if they die. Every log goes to the container's
; stdout/stderr so `docker compose logs app` shows the whole picture.
;
; The queue and scheduler can be switched off per host without editing this
; file, by setting SUPERVISOR_QUEUE_AUTOSTART / SUPERVISOR_SCHEDULER_AUTOSTART
; to "false" in .env — useful on a machine that only serves pages.
[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Every %(ENV_...)s below has a default set in the Dockerfile, so the image
; also starts correctly when run without compose.

; php-fpm's master stays root so it can drop to www-data per pool.
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
priority=10
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Jobs are the contact-form mail and the translation runs. --max-time makes the
; worker exit once an hour so a deploy's new code is picked up without a
; manual restart; autorestart brings it straight back.
[program:queue]
command=php artisan queue:work %(ENV_QUEUE_CONNECTION)s --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
priority=20
autostart=%(ENV_SUPERVISOR_QUEUE_AUTOSTART)s
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work --no-interaction
directory=/var/www/html
user=www-data
priority=30
autostart=%(ENV_SUPERVISOR_SCHEDULER_AUTOSTART)s
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
