server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;

    # Filament image fields and the contact form both post files; the php.ini
    # limit is 20 MB, so leave headroom for the multipart envelope.
    client_max_body_size 25m;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    # woff2 is already compressed — do not list font types here.
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded images live on the shared storage volume. An alias beats the
    # public/storage symlink: the link would have to be recreated on every boot
    # and would point at a path the web container does not have.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    # The policy is deliberately NOT marked `always`: a 404 (an old page asking
    # for a chunk hash that a deploy replaced) would otherwise be pinned in the
    # browser for a year even after the file is served again. add_header here
    # replaces the inherited ones, hence the repeat.
    location /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Filament's published panel assets are versioned in their path
    # (/js/filament/filament/3.x.x/...), so they are safe to cache hard too.
    location ~ ^/(css|js|fonts)/filament/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Livewire and Filament post to the same PHP entry point as pages, and an
    # editor saving a large page can take longer than the default 60s read
    # timeout would allow nginx to keep waiting.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        # Laravel's Vite Link: preload header alone is a few KB; the default 4k
        # fastcgi_buffer_size makes nginx answer 502 "upstream too big header"
        # before the body is ever sent.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
