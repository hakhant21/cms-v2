; Runtime PHP settings, copied to /usr/local/etc/php/conf.d/zz-ruma.ini.
;
; The memory figures matter: the deployed stack is sized for a 2 GB host where
; php-fpm, the queue worker, the scheduler and Redis share the machine, so each
; php-fpm worker is deliberately small and few in number.

memory_limit = 192M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

; No date.timezone here on purpose: Laravel sets it from config/app.php
; (APP_TIMEZONE) at boot, and an ini value would only fight that.

; Errors go to the container log, never into the HTML a visitor reads.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 12
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
; opcache.revalidate_freq is irrelevant while validate_timestamps = 0: the
; cached bytecode is only refreshed by a restart, which every deploy does by
; recreating the container. `make optimize` also resets it.

; Realpath is shared across all workers; keep it generous so the framework's
; many small file lookups stay in memory.
realpath_cache_size = 128K
realpath_cache_ttl = 600

session.serialize_handler = php
